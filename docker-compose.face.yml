# Optional face service. Laravel and MySQL stay on the host unless you already
# run them in Docker. This file does not replace the application's Dockerfile.
services:
  face-service:
    build: ./face-service
    ports:
      - "8090:8090"
    environment:
      FACE_API_KEY: ${FACE_SERVICE_API_KEY:-}
      FACE_MODEL_DIR: /models
      FACE_ONNX_PROVIDERS: ${FACE_ONNX_PROVIDERS:-CPUExecutionProvider}
    volumes:
      - ./face-service/models:/models:ro
